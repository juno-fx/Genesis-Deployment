{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genesis-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
{{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: "{{ $value }}"
{{- end }}
spec:
  {{- $className := .Values.ingress.className | default .Values.ingressClassName }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: genesis
                port:
                  number: 3000
      {{- /* Kubernetes rejects an IP in Ingress spec.rules[].host ("must be a
             DNS name, not an IP address"). When host is an IP, omit the field
             so the rule matches by node/LB IP via the default server block —
             mirrors the same guard in the Hubble chart's ingress. */}}
      {{- $hostIsIP := regexMatch "^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+(:[0-9]+)?$" (.Values.host | default "") }}
      {{- if and .Values.host (not $hostIsIP) }}
      host: {{ .Values.host }}
      {{- end }}
{{- end }}