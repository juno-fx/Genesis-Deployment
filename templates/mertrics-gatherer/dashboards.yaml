{{- range $path, $content := .Files.Glob "files/dashboards/*" }}
{{- $name := base $path | trimSuffix (ext $path) | lower | replace "_" "-" | replace "." "-" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
    {{- tpl ($content | toString) $ | trim | nindent 4 }}
{{- end }}